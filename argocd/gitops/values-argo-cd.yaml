chart:
  name: argo-cd
  namespace: argocd
  url: ghcr.io/argoproj/argo-helm/argo-cd
  version: 10.1.2

fullnameOverride: argocd
controller:
  replicas: 1
repoServer:
  replicas: 1
applicationSet:
  replicas: 1
configs:
  cm:
    exec.enabled: true
  repositories:
    argo-helm-repo:
      url: ghcr.io/argoproj/argo-helm/argo-cd
      name: argo
      type: helm
    crossplane-helm-repo:
      url: https://charts.crossplane.io/master
      name: crossplane
      type: helm
server:
  replicas: 1
